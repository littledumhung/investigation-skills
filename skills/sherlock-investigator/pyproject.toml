[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-investigator-skill"
version = "0.1.1"
description = "Evidence-first public-clue investigation skill with local Python helpers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=10.4"]
test = ["Pillow>=10.4", "jsonschema>=4.23", "PyYAML>=6"]

[project.scripts]
sherlock-investigator = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts"]
