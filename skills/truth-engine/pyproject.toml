[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "truth-engine"
version = "0.1.0"
description = "Auditable evidence utilities for an Agent Skill"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
media = ["Pillow>=10"]
[project.scripts]
truth-engine = "scripts.cli:main"
[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.package-data]
scripts = ["report.schema.json"]
